name: Portfolio - Production Deploy

on:
  workflow_dispatch:    

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: gabrielwaltmann/waltmann_client:latest
  COMPOSE_SERVICE: waltmann-frontend

jobs:
  build:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.prod
          push: true
          tags: ${{ env.DOCKER_IMAGE }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          script: |
            cd ~/gabrielwaltmann
            docker compose pull ${{ env.COMPOSE_SERVICE }}
            docker compose stop ${{ env.COMPOSE_SERVICE }}
            docker compose rm -f ${{ env.COMPOSE_SERVICE }}
            docker compose up -d --no-deps ${{ env.COMPOSE_SERVICE }}
