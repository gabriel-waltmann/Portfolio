name: Portfolio - Production Deploy

on:
  workflow_dispatch:    

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  DOCKER_IMAGE: gabrielwaltmann/portfolio
  COMPOSE_SERVICE: portfolio

jobs:
  build:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.prod
          push: true
          tags: ${{ env.DOCKER_IMAGE }}

  deploy:
    name: Deploy to production server
    runs-on: [self-hosted, linux, x64]
    needs: build

    steps:
      - name: Deploy application
        shell: bash
        run: |
          cd ~/
          docker compose pull "$COMPOSE_SERVICE"
          docker compose up -d --no-deps --force-recreate "$COMPOSE_SERVICE"
